[package]
name = "raeen-gui"
description = "Raeen desktop application — game library browser, settings, and debug tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "raeen"
path = "src/main.rs"

[dependencies]
raeen-core = { workspace = true }
raeen-loader = { workspace = true }
raeen-kernel = { workspace = true }
raeen-gpu = { workspace = true }
raeen-audio = { workspace = true }
raeen-input = { workspace = true }
raeen-hle = { workspace = true }
raeen-firmware = { workspace = true }
raeen-runtime = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
image = { workspace = true }
gilrs = { workspace = true }
rfd = { workspace = true }
hound = { workspace = true }
opener = { workspace = true }
egui-notify = { workspace = true }
notify = { workspace = true }
sysinfo = { workspace = true }
puffin = { workspace = true }
puffin_http = { workspace = true }
rubato = { workspace = true }
walkdir = { workspace = true }
rayon = { workspace = true }
crash-handler = { workspace = true }
minidumper = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
iced-x86 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true }
# Optional in-tree upscaler backends (spatial + vendor-runtime probes). In the
# repo and in CI, so a clean clone always resolves; still opt-in at compile time
# via `--features upscale-plugins`.
raeen-upscale = { path = "../raeen-upscale", optional = true }

[features]
# Opt-in: compile in the in-tree upscaler backends (spatial bilinear/bicubic/
# sharpen, plus FSR/DLSS/XeSS vendor-runtime probes) and register them at
# startup. Off by default so the standard build carries only the vendor-neutral
# built-ins; nothing proprietary is linked either way.
upscale-plugins = ["dep:raeen-upscale"]

[target.'cfg(windows)'.dependencies]
# Local wall-clock for the Shell's top-bar time (Win32 GetLocalTime) — the
# workspace dep, no new crates (spec §11).
windows-sys = { workspace = true }

[dev-dependencies]
# Parse a compiler-produced `guest.so` (a real nightly-rustc cdylib) in the
# M1 acceptance test so the synthesized SCE eboot faithfully mirrors its
# segments, dynamic symbols, and relocations. Workspace-pinned (0.9), same as
# raeen-firmware.
goblin = { workspace = true }
# Property tests over the pure nav state machine.
proptest = { workspace = true }
