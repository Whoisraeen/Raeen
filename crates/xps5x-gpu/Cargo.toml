[package]
name = "xps5x-gpu"
description = "GPU command translation — GNM/PM4 to Vulkan, shader recompiler, texture translation"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xps5x-core = { workspace = true }
kyty-graphics = { workspace = true }
ash = { workspace = true }
gpu-allocator = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
bitflags = { workspace = true }
bytemuck = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
raw-window-handle = { workspace = true }

# guest_mem: VirtualQuery-validated reads of the identity-mapped guest arena
# for the PM4 command processor's pointer-carrying packets.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
# SPIR-V structural validator for the shader-emitter tests. Used under its MIT
# license option (GPL-2.0-only compatible). Test-only — not linked into the
# distributed emulator. See docs/reference-port-ledger.md (SPIR-V body rows).
rspirv = "0.12"
