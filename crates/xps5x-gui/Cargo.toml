[package]
name = "xps5x-gui"
description = "XPS5X desktop application — game library browser, settings, and debug tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "xps5x"
path = "src/main.rs"

[dependencies]
xps5x-core = { workspace = true }
xps5x-loader = { workspace = true }
xps5x-kernel = { workspace = true }
xps5x-gpu = { workspace = true }
xps5x-audio = { workspace = true }
xps5x-io = { workspace = true }
xps5x-input = { workspace = true }
xps5x-hle = { workspace = true }
xps5x-firmware = { workspace = true }
xps5x-runtime = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
image = { workspace = true }
gilrs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Local wall-clock for the Shell's top-bar time (Win32 GetLocalTime) — the
# workspace dep, no new crates (spec §11).
windows-sys = { workspace = true }

[dev-dependencies]
# Parse a compiler-produced `guest.so` (a real nightly-rustc cdylib) in the
# M1 acceptance test so the synthesized SCE eboot faithfully mirrors its
# segments, dynamic symbols, and relocations. Workspace-pinned (0.9), same as
# xps5x-firmware.
goblin = { workspace = true }
