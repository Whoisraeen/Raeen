[package]
name = "raeen-core"
description = "Core engine for Raeen PS5 emulator — configuration, logging, and shared types"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
serde = { workspace = true }
# Per-title trophy unlock store (`trophies.rs`) — small JSON files next to
# the save-data host map, shared by raeen-hle (writer) and raeen-gui (reader).
serde_json = { workspace = true }
toml = { workspace = true }
bitflags = { workspace = true }

# High-resolution waitable timers + multimedia timer period for `host_sleep`:
# the guest sleep floor and condition-variable wait granularity are both Win32
# concerns, and both are measured in that module's docs.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
