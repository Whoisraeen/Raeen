[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/raeen-core",
    "crates/raeen-loader",
    "crates/raeen-kernel",
    "crates/raeen-gpu",
    "crates/raeen-audio",
    "crates/raeen-io",
    "crates/raeen-input",
    "crates/raeen-hle",
    "crates/raeen-gui",
    "crates/raeen-firmware",
    "crates/raeen-runtime",
    # Kyty port (docs/superpowers/plans/2026-07-13-kyty-full-port.md)
    "crates/kyty-core",
    "crates/kyty-math",
    "crates/kyty-graphics",
]
# BYO, git-ignored present plugins (upscalers/frame-gen). Excluded from the
# workspace so `cargo build --workspace` never requires them; they are pulled in
# only as an OPTIONAL path dependency behind raeen-gui's `upscale-plugins`
# feature. See plugins/README.md.
exclude = ["plugins"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/Whoisraeen/Raeen"
rust-version = "1.85"

[workspace.dependencies]
# Core
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
bitflags = "2"
bytemuck = { version = "1", features = ["derive"] }
zerocopy = { version = "0.8", features = ["derive"] }
memmap2 = "0.9"
rayon = "1"
parking_lot = "0.12"
dashmap = "6"
crossbeam = "0.8"

# ELF / Binary parsing
goblin = "0.9"
scroll = "0.12"

# Graphics (Vulkan)
ash = "0.38"
gpu-allocator = { version = "0.27", features = ["vulkan"] }

# Windowing
winit = "0.30"
raw-window-handle = "0.6"

# GUI
egui = "0.31"
eframe = { version = "0.31", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Audio
cpal = "0.15"
tracing-appender = "0.2"

# Input
gilrs = "0.11"

# Compression / Decompression
lz4_flex = "0.11"
zstd = "0.13"
flate2 = "1"
lzma-rs = "0.3"

# Updater (GitHub Releases over HTTPS + release JSON)
ureq = "2"
serde_json = "1"

# Firmware crypto + NID hashing
aes = "0.9"
cbc = "0.2"
sha1 = "0.10"
base64 = "0.22"
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "intel", "std"] }

# Windows OS APIs — VirtualAlloc/VEH for raeen-runtime, GetLocalTime for
# raeen-gui's top-bar clock
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    # GUI-subsystem console reattach (AttachConsole) for CLI invocations.
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    # Added for the kyty-core Sys layer port (VirtualAlloc/VirtualProtect,
    # file IO, threading/sync). Additive — does not affect existing crates.
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    # Native, mapping-DB-free controller readers in raeen-input (SharpEmu port):
    # XInput (Xbox) + raw-HID DualSense via SetupDi enumeration. Additive.
    "Win32_UI_Input_XboxController",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
] }

# Internal crates
raeen-core = { path = "crates/raeen-core" }
raeen-loader = { path = "crates/raeen-loader" }
raeen-kernel = { path = "crates/raeen-kernel" }
raeen-gpu = { path = "crates/raeen-gpu" }
raeen-audio = { path = "crates/raeen-audio" }
raeen-io = { path = "crates/raeen-io" }
raeen-input = { path = "crates/raeen-input" }
raeen-hle = { path = "crates/raeen-hle" }
raeen-gui = { path = "crates/raeen-gui" }
raeen-firmware = { path = "crates/raeen-firmware" }
raeen-runtime = { path = "crates/raeen-runtime" }
kyty-graphics = { path = "crates/kyty-graphics" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"

[profile.dev]
opt-level = 1  # Slightly optimized dev builds for emulator performance
