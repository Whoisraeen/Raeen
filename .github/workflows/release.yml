name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # build.ps1 does everything: cargo build --release, regenerate branding,
      # portable ZIP, and compile the Inno installer (ISCC from choco above).
      - name: Build installer + portable ZIP
        shell: pwsh
        run: ./installer/build.ps1 -Version ${{ steps.ver.outputs.version }}

      # Bare exe published alongside the installer: the in-app updater downloads
      # this asset directly (matched by its "-windows-x86_64.exe" suffix) so it
      # never has to unpack the installer or the portable archive.
      - name: Stage updater asset (bare exe)
        shell: pwsh
        run: Copy-Item target/release/raeen.exe dist/raeen-windows-x86_64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Raeen-${{ steps.ver.outputs.version }}-Setup.exe
            dist/Raeen-${{ steps.ver.outputs.version }}-portable-win64.zip
            dist/raeen-windows-x86_64.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
